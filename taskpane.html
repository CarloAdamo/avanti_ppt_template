<!doctype html>
<html lang="sv">

<head>
    <meta charset="utf-8">
    <title>Avanti Templates</title>
    <link rel="stylesheet" href="taskpane.css">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            margin: 0;
        }

        header {
            padding: 12px;
            border-bottom: 1px solid #eee;
            background-color: #3C8A59;
            color: white;
        }

        main {
            padding: 12px;
        }

        #q {
            width: 100%;
            padding: 8px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .thumbnail {
            width: 120px;
            height: auto;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .card-content {
            flex: 1;
        }

        .title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .meta {
            color: #666;
            font-size: 12px;
            margin: 4px 0;
        }

        .summary {
            color: #333;
            font-size: 13px;
            margin-top: 6px;
        }

        .actions {
            margin-top: 10px;
        }

        button {
            padding: 6px 10px;
        }

        /* Upload button */
        .upload-btn {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            background-color: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .upload-btn:hover {
            background-color: rgba(255,255,255,0.3);
        }
        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Upload modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 300px;
            text-align: center;
        }
        .modal h3 {
            margin: 0 0 16px 0;
            color: #333;
        }
        .modal .progress-text {
            color: #666;
            margin-bottom: 12px;
        }
        .modal .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .modal .progress-bar-fill {
            height: 100%;
            background: #3C8A59;
            width: 0%;
            transition: width 0.3s ease;
        }
        .modal .error {
            color: #c00;
            margin-bottom: 12px;
        }
        .modal .success {
            color: #3C8A59;
            margin-bottom: 12px;
        }
        .modal button {
            padding: 8px 16px;
            background: #3C8A59;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <h3>Avanti Templates</h3>
        <input type="text" id="search" placeholder="Search slides..." style="width:100%;padding:8px;margin:8px 0;box-sizing:border-box;">
        <div id="filters" style="display:flex;gap:8px;margin:8px 0;">
            <select id="filter-template" style="flex:1;min-width:0;padding:6px;overflow:hidden;text-overflow:ellipsis;">
                <option value="">All templates</option>
            </select>
            <select id="filter-section" style="flex:1;min-width:0;padding:6px;overflow:hidden;text-overflow:ellipsis;">
                <option value="">All sections</option>
            </select>
        </div>
        <p id="status" style="margin:8px 0;color:rgba(255,255,255,0.8);"></p>
        <button class="upload-btn" onclick="uploadPresentation()">
            📤 Add this presentation to library
        </button>
    </header>

    <!-- Upload Modal -->
    <div id="upload-modal" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Uploading...</h3>
            <p id="modal-text" class="progress-text">Preparing presentation...</p>
            <div class="progress-bar">
                <div id="modal-progress" class="progress-bar-fill"></div>
            </div>
            <p id="modal-error" class="error" style="display:none;"></p>
            <p id="modal-success" class="success" style="display:none;"></p>
            <button id="modal-close" onclick="closeModal()" style="display:none;">Close</button>
        </div>
    </div>
    <main style="padding:12px;">
        <div id="slides"></div>
    </main>
    <script src="taskpane.js"></script>
</body>

</html>
